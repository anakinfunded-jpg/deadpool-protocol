services:
  - type: web
    name: deadpool-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn death_engine:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: MORALIS_API_KEY
        sync: false
      - key: PORT
        value: 10000
